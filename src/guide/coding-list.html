<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<title>코딩리스트</title>
		<link rel="stylesheet" href="/assets/scss/style.scss" />
	</head>
	<body>
		<div class="coding-wrap">
			<div class="coding-tree">
				<div class="coding-tree_head">
					<h1 class="coding-tree_title">Coding List</h1>
					<p class="coding-tree_summary">전체 <span data-total>0</span> / 완료 <span data-done>0</span></p>
					<div class="coding-tree_search">
						<input type="text" placeholder="페이지명, ID, 작업자 검색" data-search-input />
						<button
							type="button"
							class="search_clear"
							data-search-clear
							aria-label="검색어 지우기"
						></button>
					</div>
				</div>

				<div class="tree" data-tree>
					<p class="tree_loading">목록을 불러오는 중입니다.</p>
				</div>
			</div>

			<div class="coding-view">
				<div class="coding-view_bar">
					<button
						type="button"
						class="coding-view_toggle"
						data-toggle-sidebar
						aria-label="사이드바 토글"
					></button>
					<strong class="coding-view_title" data-view-title>페이지를 선택하세요</strong>
					<span class="coding-view_path" data-view-path></span>
					<a href="#" target="_blank" class="coding-view_btn" data-view-link>새창열기</a>
				</div>

				<iframe
					src=""
					class="coding-view_frame"
					data-view-frame
					src="./../html/index.html"
					title="페이지 미리보기"
				></iframe>
			</div>
		</div>

		<script type="module" src="coding-list.js"></script>
	</body>
</html>
