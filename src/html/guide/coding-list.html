<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<title>코딩리스트</title>
		<link rel="stylesheet" href="/assets/scss/style.scss" />
	</head>
	<body>
		<div class="coding-wrap">
			<aside class="coding-tree">
				<div class="coding-tree_head">
					<h1 class="coding-tree_title">Coding List</h1>
					<p class="coding-tree_summary">전체 <span data-total>0</span> / 완료 <span data-done>0</span></p>
				</div>

				<div class="tree" data-tree>
					<p class="tree_loading">목록을 불러오는 중입니다.</p>
				</div>
			</aside>

			<section class="coding-view">
				<div class="coding-view_bar">
					<strong class="coding-view_title" data-view-title>페이지를 선택하세요</strong>
					<span class="coding-view_path" data-view-path></span>
					<a href="#" target="_blank" class="coding-view_btn" data-view-link>새창열기</a>
				</div>

				<iframe src="" class="coding-view_frame" data-view-frame title="페이지 미리보기"></iframe>
			</section>
		</div>

		<script type="module" src="/assets/js/coding-list.js"></script>
	</body>
</html>
